name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id (e.g. Ep03-Airports)"
        required: true
        default: "Ep03-Airports"
      chunks:
        description: "Parallel chunks: auto (~1 per minute) or a number up to 20"
        required: false
        default: "auto"
      crf:
        description: "H.264 CRF (lower = better quality)"
        required: false
        default: "15"

run-name: "Render ${{ inputs.composition }}"

env:
  COMP: ${{ inputs.composition }}
  CRF: ${{ inputs.crf }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: plan
        run: node cloud/plan.mjs "$COMP" "${{ inputs.chunks }}"

  video:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: chunk ${{ matrix.i }} (${{ matrix.start }}-${{ matrix.end }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Lossless PCM audio inside MKV so chunks join without clicks or gaps
      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: >
          npx remotion render src/index.ts "$COMP" "out/chunk-${{ matrix.i }}.mkv"
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --codec=h264 --audio-codec=pcm-16 --crf="$CRF"
          --concurrency=2 --gl=angle --log=info
      - uses: actions/upload-artifact@v5
        with:
          name: chunk-${{ matrix.i }}
          path: out/chunk-${{ matrix.i }}.mkv
          retention-days: 1
          compression-level: 0

  merge:
    needs: video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v5
        with:
          path: parts
          merge-multiple: true
      - name: Join chunks
        run: |
          mkdir -p final
          ls parts/chunk-*.mkv | sort | sed "s|^|file '$PWD/|; s|$|'|" > list.txt
          cat list.txt
          npx remotion ffmpeg -hide_banner -y -f concat -safe 0 -i list.txt \
            -map 0:v:0 -map 0:a:0 -c:v copy -c:a aac -b:a 320k -movflags +faststart \
            "final/$COMP.mp4"
          npx remotion ffprobe -hide_banner "final/$COMP.mp4"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.composition }}
          path: final/${{ inputs.composition }}.mp4
          retention-days: 7
          compression-level: 0
