name: Prepare voice

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Voice config (e.g. cloud/voice/ep10.json)"
        required: true
        default: "cloud/voice/ep10.json"

run-name: "Voice ${{ inputs.config }}"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper==1.1.1 requests
      - run: python cloud/voice/prepare.py "${{ inputs.config }}"
      - name: Commit audio + word timings
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add public/audio src/videos
          git commit -m "Voiceover + word timings for ${{ inputs.config }}" || echo "nothing to commit"
          git pull --rebase
          git push
