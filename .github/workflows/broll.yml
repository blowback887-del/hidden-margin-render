name: Fetch stock

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Stock list (e.g. cloud/broll/ep10.json)"
        required: true
        default: "cloud/broll/ep10.json"

run-name: "Stock ${{ inputs.config }}"

permissions:
  contents: write

jobs:
  broll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core poppler-utils
      - name: Browser for web-page evidence (only if the config has it)
        run: |
          if python3 -c "import json,sys; c=json.load(open('${{ inputs.config }}')); sys.exit(0 if any((e.get('type') or ('pdf' if e['url'].lower().split('?')[0].endswith('.pdf') else 'page'))=='page' for e in c.get('evidence',[])) else 1)"; then
            pip install -q playwright && python3 -m playwright install --with-deps chromium
          fi
      - name: Live-footage check (YouTube / archive.org pages in the config)
        id: live
        run: |
          python3 -c "import json,sys; c=json.load(open('${{ inputs.config }}')); sys.exit(0 if c.get('probe') or any(x.get('src') for x in c.get('clips',[])) else 1)" && echo "need=1" >> "$GITHUB_OUTPUT" || true
      - if: steps.live.outputs.need == '1'
        uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - if: steps.live.outputs.need == '1'
        run: pip install -q -U "yt-dlp[default]" && yt-dlp --version
      - run: python3 cloud/broll/fetch.py "${{ inputs.config }}"
      - name: Commit clips + contact sheet
        run: |
          git config user.name "broll-bot"
          git config user.email "broll-bot@users.noreply.github.com"
          git add public/broll public/research public/sfx public/evidence 2>/dev/null || git add public/broll public/research public/sfx
          git commit -m "Stock clips for ${{ inputs.config }}" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; echo "push race, retry $i"; sleep $((RANDOM % 15 + 5)); done
